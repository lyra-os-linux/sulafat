name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    # Trixie provides VTE >= 0.80, as required by vte4's v0_80 feature.
    # The Ubuntu 24.04 host image only provides VTE 0.76.
    container: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      GSETTINGS_BACKEND: memory
    steps:
      - name: Controlled failure for branch-protection qualification
        if: github.event_name == 'pull_request' && github.head_ref == 'test/ci-protection-1'
        run: |
          sleep 45
          echo '::error::Intentional failure to qualify required-check enforcement (issue #1).'
          exit 1
      - name: Install build tools, GTK, VTE and packaging validators
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev gettext appstream-util desktop-file-utils rpm openssh-client
          pkg-config --atleast-version=0.80 vte-2.91-gtk4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Test SSH configuration and persistence contracts
        run: cargo test --workspace --locked
      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Validate translations, desktop metadata and RPM spec
        run: |
          python3 scripts/check-i18n.py
          desktop-file-validate data/org.lyraos.Sulafat.desktop
          appstream-util validate-relax --nonet data/org.lyraos.Sulafat.metainfo.xml
          rpmspec -P packaging/sulafat.spec >/dev/null
