name: Contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    # Tauri 2 needs WebKitGTK 4.1 and libsoup 3 headers.
    container: debian:trixie
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      GSETTINGS_BACKEND: memory
    steps:
      - name: Install build tools, WebKitGTK and packaging validators
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config python3 libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev gettext appstream-util desktop-file-utils rpm openssh-client
          pkg-config --exists webkit2gtk-4.1 libsoup-3.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - name: Test SSH configuration and persistence contracts
        run: cargo test --workspace --locked
      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Validate translations, desktop metadata and RPM spec
        run: |
          python3 scripts/check-i18n.py
          desktop-file-validate data/org.lyraos.Sulafat.desktop
          appstream-util validate-relax --nonet data/org.lyraos.Sulafat.metainfo.xml
          rpmspec -P packaging/sulafat.spec >/dev/null
